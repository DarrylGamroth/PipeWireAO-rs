[workspace]
resolver = "2"
members = [
  "libspa-sys",
  "libspa",
  "pipewire-sys",
  "pipewire",
]

[workspace.package]
authors = ["Tom Wagner <tom.a.wagner@protonmail.com>", "Guillaume Desmottes <guillaume.desmottes@collabora.com>"]
categories = ["api-bindings", "multimedia"]
edition = "2021"
license = "MIT"
# When bumping MSRV, don't forget to update it also in .gitlab-ci.yml
rust-version = "1.80"
version = "0.10.1"

[workspace.dependencies]
pipewire = { package = "pipewire-ao", path = "./pipewire" }
pipewire-sys = { package = "pipewire-ao-sys", path = "./pipewire-sys" }

# Aliases
pw_sys = { package = "pipewire-ao-sys", version = "0.10", path = "./pipewire-sys" }
spa_sys = { package = "libspa-ao-sys", version = "0.10", path = "./libspa-sys" }
spa = { package = "libspa-ao", version = "0.10", path = "./libspa" }

# External
libc = "0.2"
rustix = { version = "1.1", features = ["std", "fs", "process", "time", "pipe"] }
bitflags = "2"
cookie-factory = { version = "0.3.3", default-features = false }
nom = "8.0.0"

# External - dev
clap = "4.3.2"

# External - build
bindgen = { version = "0.72.0", default-features = false }
system-deps = "7.0.5"
cc = "1.0.61"
